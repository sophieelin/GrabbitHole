<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GrabbitHole</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; }
      label { display: block; margin-bottom: 4px; }
      input { width: 100%; box-sizing: border-box; margin-bottom: 8px; }
      #status { margin-top: 8px; white-space: pre-wrap; }

    <script src="popup.js" type="module"></script>
  </body>
</html>
